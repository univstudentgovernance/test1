<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="아고라 15기 지원서 접수 완료">
  <title>지원 완료 — AGORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17231d;--paper:#f4f0e7;--cream:#fffaf0;--green:#1e4b36;--mint:#cdddba;--line:rgba(23,35,29,.18);--orange:#e86932}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif;display:grid;grid-template-rows:auto 1fr auto}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}header{border-bottom:1px solid var(--line)}nav{height:74px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:"DM Serif Display";font-size:25px;letter-spacing:.05em}.status{font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px}.status i{width:8px;height:8px;background:var(--orange);border-radius:50%}
    main{display:grid;place-items:center;padding:70px 0}.panel{width:min(820px,100%);background:var(--cream);border:1px solid var(--line);padding:72px;position:relative;overflow:hidden}.panel:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:var(--mint);right:-90px;top:-110px}.check{width:66px;height:66px;background:var(--green);color:white;border-radius:50%;display:grid;place-items:center;font-size:29px;margin-bottom:40px}.kicker{font-size:12px;letter-spacing:.17em;font-weight:700;color:var(--orange);text-transform:uppercase}.panel h1{font-family:"DM Serif Display","Noto Sans KR";font-size:clamp(48px,7vw,76px);font-weight:400;line-height:1.08;letter-spacing:-.035em;margin:15px 0 26px}.lead{font-size:18px;line-height:1.8;color:#4f5b54;max-width:600px}.info{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:40px 0}.info div{background:var(--paper);padding:20px}.info b{display:block;font-size:12px;margin-bottom:7px}.info span{font-size:14px;color:#657069}.button{display:inline-flex;align-items:center;gap:18px;background:var(--ink);color:white;text-decoration:none;padding:17px 24px;font-weight:700;font-size:14px}.button:hover{background:var(--green)}footer{border-top:1px solid var(--line);padding:25px 0;font-size:12px;color:#717a75}.footer-inner{display:flex;justify-content:space-between;gap:20px}
    @media(max-width:650px){.panel{padding:40px 25px}.info{grid-template-columns:1fr}.panel h1{font-size:48px}.lead{font-size:16px}.footer-inner{display:block}.footer-inner span{display:block;margin-top:6px}}
  </style>
</head>
<body>
  <header><nav class="wrap"><span class="brand">AGORA.</span><span class="status"><i></i> APPLICATION COMPLETE</span></nav></header>
  <main class="wrap"><section class="panel"><div class="check">✓</div><span class="kicker">Thank you</span><h1>지원서가<br>접수되었습니다.</h1><p class="lead">아고라 15기에 관심을 가지고 지원해주셔서 감사합니다. 작성하신 지원서는 운영진에게 안전하게 전달되었습니다.</p><div class="info"><div><b>결과 안내</b><span>서류 검토 후 입력한 연락처로 개별 안내</span></div><div><b>문의</b><span>univ.studentgovernance@gmail.com</span></div></div><a class="button" href="index.html">홈페이지로 돌아가기 <span>→</span></a></section></main>
  <footer><div class="wrap footer-inner"><span>대학생 연합학회 아고라</span><span>© 2026 AGORA. All rights reserved.</span></div></footer>
</body>
</html>
